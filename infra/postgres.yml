# Included by docker-compose.yml. Paths here are relative to infra/.
# Start it alone for local dev: pnpm db:up
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bedrock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bedrock}
      POSTGRES_DB: ${POSTGRES_DB:-bedrock}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty volume. Re-run it with pnpm db:reset.
      - ./postgres-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
