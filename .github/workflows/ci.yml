# CI: the same checks as the git hooks and CLAUDE.md, plus the Docker images.
#
# Adding CD later: create .github/workflows/deploy.yml that runs on push to main,
# calls this workflow first (`jobs.ci.uses: ./.github/workflows/ci.yml`) and
# deploys in a job that `needs: ci`. Then remove the `push` trigger below so CI
# doesn't run twice per push. The docker job shares its build cache with deploy
# through the per-app `scope`, so deploy rebuilds warm and only adds `push: true`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A literal prefix, not github.workflow: in a called workflow that is the
# caller's name, which would put deploy and this run in the same group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Commit messages and file names are checked only locally, by the Lefthook hooks.
      - name: Biome
        run: pnpm exec biome ci --error-on-warnings .

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
