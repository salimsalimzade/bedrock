# Shared by every workflow job (CI now, CD later): Node from .nvmrc, pnpm from
# package.json's packageManager, and a frozen install.
name: Setup
description: Install Node, pnpm and the workspace dependencies

runs:
  using: composite
  steps:
    # No version input: it reads packageManager from package.json.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
